<header appPageHeader>
	<h1 appPageTitle i18n data-po="settings-page-title">Producer settings</h1>
</header>

<form appForm [formRoot]="settingsForm">
	<label i18n [appFormLabel]="settingsForm.instrumentCount">Instrument count</label>

	<input
		appFormInput
		type="number"
		[formField]="settingsForm.instrumentCount"
		data-po="settings-page-instrument-count"
	/>

	<p
		*appFormIfInvalid="settingsForm.instrumentCount; let field"
		i18n
		[appFormError]="field"
		data-po="settings-page-instrument-count-error"
	>
		Enter a whole number from {{ field.min?.() }} to {{ field.max?.() }}.
	</p>

	<label i18n [appFormLabel]="settingsForm.updatesPerBatch">Updates per batch</label>

	<input
		appFormInput
		type="number"
		[formField]="settingsForm.updatesPerBatch"
		data-po="settings-page-updates-per-batch"
	/>

	<p
		*appFormIfInvalid="settingsForm.updatesPerBatch; let field"
		i18n
		[appFormError]="field"
		data-po="settings-page-updates-per-batch-error"
	>
		Enter a whole number from {{ field.min?.() }} to {{ field.max?.() }}.
	</p>

	<label i18n [appFormLabel]="settingsForm.batchIntervalMs">Batch interval, ms</label>

	<input appFormInput type="number" [formField]="settingsForm.batchIntervalMs" data-po="settings-page-batch-interval" />

	<p
		*appFormIfInvalid="settingsForm.batchIntervalMs; let field"
		i18n
		[appFormError]="field"
		data-po="settings-page-batch-interval-error"
	>
		Enter a whole number from {{ field.min?.() }} to {{ field.max?.() }}.
	</p>

	<p appNote i18n>Applying starts a new run and clears the current values and totals.</p>

	<button appButton="primary" i18n type="submit" data-po="settings-page-apply">Apply</button>
</form>
