<header class="root-header">
	<span class="root-brand" i18n>Realtime Fintech Dashboard</span>
	<nav class="root-nav" aria-label="Main" i18n-aria-label>
		<a
			class="root-link"
			ariaCurrentWhenActive="page"
			i18n
			routerLinkActive="root-link-active"
			[routerLink]="routes.Dashboard"
			data-po="root-dashboard-link"
		>
			Dashboard
		</a>
		<a
			class="root-link"
			ariaCurrentWhenActive="page"
			i18n
			routerLinkActive="root-link-active"
			[routerLink]="routes.Settings"
			data-po="root-settings-link"
		>
			Settings
		</a>
	</nav>
</header>
<main class="root-content">
	<router-outlet />
</main>
